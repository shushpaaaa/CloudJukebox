plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cloudjukebox" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "dev.arbjerg:lavaplayer:2.2.7"
	include "dev.arbjerg:lavaplayer:2.2.7"
	include "dev.arbjerg:lavaplayer-natives:2.2.7"
	include "dev.arbjerg:lava-common:2.2.7"
	include "org.mozilla:rhino-engine:1.7.14"
	include "org.mozilla:rhino:1.7.14"
	include "com.fasterxml.jackson.core:jackson-databind:2.15.2"
	include "com.fasterxml.jackson.core:jackson-core:2.15.2"
	include "com.fasterxml.jackson.core:jackson-annotations:2.15.2"
	include "org.jsoup:jsoup:1.16.1"
	include "net.iharder:base64:2.3.9"
	include "org.json:json:20240303"
	include "org.apache.httpcomponents:httpclient:4.5.14"
	include "org.apache.httpcomponents:httpcore:4.4.16"
	include "commons-logging:commons-logging:1.2"
	include "commons-codec:commons-codec:1.16.0"
	include "commons-io:commons-io:2.15.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
